; /etc/supervisor/conf.d/wifi-billing.conf
; Alternative to the systemd units in this directory.

[program:wifi-billing-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/wifi-billing/artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/wifi-billing
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/wifi-billing/worker.log
stopwaitsecs=150

[program:wifi-billing-scheduler]
command=php /var/www/wifi-billing/artisan schedule:work
directory=/var/www/wifi-billing
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/wifi-billing/scheduler.log
stopwaitsecs=150
