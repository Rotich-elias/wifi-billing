; /etc/supervisor/conf.d/teto-net.conf
; Alternative to the systemd units in this directory.

[program:teto-net-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/teto-net/artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/teto-net
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/teto-net/worker.log
stopwaitsecs=150

[program:teto-net-scheduler]
command=php /var/www/teto-net/artisan schedule:work
directory=/var/www/teto-net
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/teto-net/scheduler.log
stopwaitsecs=150
